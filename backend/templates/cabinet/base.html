<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Кабінет студента{% endblock %} — Paradigm</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --text: #f2f5f8;
      --muted: #9aa8b5;
      --accent: #3dd6c6;
      --accent-dim: #2a9d8f;
      --border: #2a3542;
      --danger: #e76f51;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2a32 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; gap: 1rem; flex-wrap: wrap;
    }
    .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.02em; }
    .brand span { color: var(--accent); }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1rem;
    }
    .muted { color: var(--muted); }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #06221f;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn:hover { background: #5ee0d2; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .progress {
      height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
      margin: 0.6rem 0 0.2rem;
    }
    .progress > i {
      display: block; height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    }
    input[type=text], input[type=password] {
      width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px;
      border: 1px solid var(--border); background: #121820; color: var(--text);
      margin-bottom: 0.85rem;
    }
    label { display: block; margin-bottom: 0.35rem; color: var(--muted); font-size: 0.9rem; }
    ul.lessons { list-style: none; padding: 0; margin: 0; }
    ul.lessons li {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.75rem 0; border-bottom: 1px solid var(--border);
    }
    ul.lessons li:last-child { border-bottom: none; }
    .done { color: var(--accent); }
    .error { color: var(--danger); margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">IT <span>Paradigm</span> — кабінет</div>
      {% if user.is_authenticated %}
      <div>
        <span class="muted">{{ user.get_full_name|default:user.username }}</span>
        &nbsp;·&nbsp;
        <a href="{% url 'cabinet-logout' %}">Вийти</a>
      </div>
      {% endif %}
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
